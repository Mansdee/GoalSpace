<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GoalSpace - Find & Book Your Futsal Space</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="CSS/base.css">
    <link rel="stylesheet" href="CSS/home.css">
</head>
<body>

    <header class="site-header">
        <div class="container header-inner">
            <a href="index.html" class="header-logo">
                <img src="assets/logo-header.png" alt="GoalSpace">
            </a>

            <button type="button" class="menu-toggle" aria-label="Open Menu" aria-expanded="false" aria-controls="header-menu">
                <svg class="icon-menu" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M4 5h16"/>
                    <path d="M4 12h16"/>
                    <path d="M4 19h16"/>
                </svg>
                <svg class="icon-close" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M18 6 6 18"/>
                    <path d="m6 6 12 12"/>
                </svg>
            </button>

            <div class="header-menu" id="header-menu">
                <nav class="main-nav">
                    <a href="index.html" class="active">Home</a>
                    <a href="#">Venues</a>
                    <a href="#">Leagues</a>
                    <a href="#">About Us</a>
                </nav>

                <div class="header-actions">
                    <a href="login.html" class="btn-pill btn-pill--ghost">Log In</a>
                    <a href="signup.html" class="btn-pill btn-pill--primary">Get Started</a>
                </div>
            </div>

        </div>
    </header>

    <main>
        <section class="hero">
            <div class="container">

                <div class="hero-card">
                    <div class="hero-content">
                        <span class="hero-badge">#1 Futsal Community</span>
                        <h1>Find & Book Your <span class="text-green">Futsal Space</span></h1>
                        <p>Join thousands of players booking the best courts in the city. Instant confirmation, secure payments.</p>

                        <div class="hero-actions">
                            <a href="#" class="btn-hero btn-hero--accent">
                                Book Now
                                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M5 12h14"/>
                                    <path d="m12 5 7 7-7 7"/>
                                </svg>
                            </a>
                            <a href="#" class="btn-hero btn-hero--glass">
                                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M9 9.003a1 1 0 0 1 1.517-.859l4.997 2.997a1 1 0 0 1 0 1.718l-4.997 2.997A1 1 0 0 1 9 14.996z"/>
                                    <circle cx="12" cy="12" r="10"/>
                                </svg>
                                Watch Video
                            </a>
                        </div>
                    </div>

                    <div class="search-bar" role="search">
                        <div class="search-field">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M20 10c0 4.993-5.539 10.193-7.399 11.799a1 1 0 0 1-1.202 0C9.539 20.193 4 14.993 4 10a8 8 0 0 1 16 0"/>
                                <circle cx="12" cy="10" r="3"/>
                            </svg>
                            <div>
                                <label for="where">Where</label>
                                <input type="text" id="where" placeholder="City or Venue...">
                            </div>
                        </div>

                        <div class="search-field">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M8 2v3"/>
                                <path d="M16 2v3"/>
                                <rect x="3" y="3" width="18" height="18" rx="2"/>
                                <path d="M3 9h18"/>
                            </svg>
                            <div>
                                <label for="date">When</label>
                                <input type="text" id="date" placeholder="Select Date">
                            </div>
                        </div>

                        <div class="search-field">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <circle cx="12" cy="12" r="10"/>
                                <path d="M12 6v6l4 2"/>
                            </svg>
                            <div>
                                <label for="time">Time</label>
                                <input type="text" id="time" placeholder="Select Time">
                            </div>
                        </div>

                        <button type="button" class="search-button" aria-label="Search">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="m21 21-4.34-4.34"/>
                                <circle cx="11" cy="11" r="8"/>
                            </svg>
                        </button>
                    </div>
                </div>
            </div>
        </section>

    </main>

    <footer>

    </footer>
    
    <script src="JS/home.js"></script>
</body>
</html>
